<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmChat Invite</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    main {
      width: min(90%, 420px);
      padding: 32px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    p {
      line-height: 1.5;
      color: #555;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      border-radius: 8px;
      background: #222;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main>
    <h1>Estas invitado a FilmChat</h1>

    <p>
      Alguien te ha invitado a unirte a un grupo privado de FilmChat.
    </p>

    <a id="open-app" href="#">Open FilmChat</a>

    <!-- APK_PREVIEW_LINK_START -->
    <a id="download-apk" href="https://expo.dev/artifacts/eas/Lp9Qbl9pQlfF0JcKHxGbCk8eh1VqZ3rQH-6HGqeqKLg.apk">Download FilmChat Android preview (APK)</a>
    <!-- APK_PREVIEW_LINK_END -->

    <p>
      Si no tienes FilmChat instalado, instala la app y abre esta invitación de nuevo.
    </p>
  </main>

  <script>
    const openApp = document.getElementById('open-app');

    openApp.href =
      'filmchat://invite/' +
      window.location.pathname.split('/invite/')[1] +
      window.location.search;
  </script>
</body>
</html>
